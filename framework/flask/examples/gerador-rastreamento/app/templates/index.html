<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Rastreamento</title>
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>
<body>
<header class="flex items-center justify-between mt-0 bg-cyan-500 text-white p-4 rounded-lg shadow-md">

    <a href="/">
        <img src="{{ url_for('static', filename='svg/logo.svg') }}" alt="Logo" class="h-10">
    </a>

    <h1 class="text-2xl font-bold">
        Gerador de Rastreamento
    </h1>
</header>

<main class="flex flex-col items-center justify-center min-h-screen bg-cyan-100 p-6">

    <div id="tela_codigo" class="flex flex-col items-center gap-4 bg-white p-8 rounded-2xl shadow-xl border border-cyan-200 transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl">

        <h2 class="text-xl font-bold mb-4">Gerador de código de rastreamento</h2>

        <div id="codigo" class="w-full bg-slate-100 border-2 border-dashed border-cyan-400 rounded-xl p-5 text-center text-2xl font-mono font-bold tracking-[0.3em] text-cyan-700">
             Aqui aparecerá o código 
        </div>

        <p id="mensagem" class="mt-3 text-sm font-medium text-red-600">erro no cog</p>
        
        <p>Clique no botão para gerar um código.</p>
    </div>

    <form method="POST">
        <button class="mt-6 bg-cyan-600 text-white px-8 py-3 rounded-xl font-semibold shadow-lg transition-all duration-300 hover:bg-cyan-700 hover:scale-105 active:scale-95" type="button">Gerar código</button>
    </form>
</main>


</body>
</html>
