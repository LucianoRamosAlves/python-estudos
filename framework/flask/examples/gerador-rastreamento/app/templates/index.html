{% extends "base.html" %}

{% block content %}

<main class="flex flex-col items-center justify-center min-h-screen bg-cyan-100 p-6">

    <div id="tela_codigo"
        class="flex flex-col items-center gap-4 bg-white p-8 rounded-2xl shadow-xl border border-cyan-200 transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl">

        <h2 class="text-xl font-bold mb-4">Gerador de código de rastreamento</h2>

        {% if codigo %}
        <div id="codigo"
            class="w-full bg-slate-100 border-2 border-dashed border-green-400 rounded-xl p-5 text-center text-2xl font-mono font-bold tracking-[0.3em] text-cyan-700">
            {{ codigo }}
        </div>

        {% else %}
        <p>Clique no botão para gerar um código.</p>
        {% endif %}


        {% if mensagem %}
        <p id="mensagem" class="mt-3 text-sm font-medium text-green-600">{{ mensagem }}</p>
        {% endif %}

    </div>

    <form method="POST" max-w-md class="w-full flex flex-col items-center gap-4 mt-6">
        <label for="tipo" class="text-xl font-bold mb-4">Tipo do produto</label>

        <select name="tipo" id="tipo" class="w-full bg-slate-100 border border-cyan-300 rounded-xl p-3 text-center text-lg font-mono tracking-[0.3em] text-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent hover:cursor-pointer hover:bg-slate-200">

            <option value="" selected disabled>Selecione</option>
            <option value="produto">Eletrônicos</option>
            <option value="documento">Roupas</option>
            <option value="documento">Móveis</option>
            <option value="documento">Livros</option>
            <option value="outro">Outro</option>
        </select>

        <div class=" flex items-center gap-3">
        <label for="entrega" class="text-base font-bold mb-4">Tipo da entrega</label>
        <select name="entrega" id="entrega" class="w-full bg-slate-100 border border-cyan-300 rounded-xl p-2 text-center text-sm font-mono tracking-[0.2em] text-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent hover:cursor-pointer hover:bg-slate-200"flex-row>
            <option value="" selected disabled>Selecione</option>
            <option value="normal">Normal</option>
            <option value="expressa">Expressa</option>
        </select>
        </div>


        <button
            class="mt-6 bg-cyan-600 text-white px-8 py-3 rounded-xl font-semibold shadow-lg transition-all duration-300 hover:bg-cyan-700 hover:scale-105 active:scale-95"
            type="submit">Gerar código</button>
    </form>
    <a href="{{ url_for('consultas') }}">
        <button
            class="mt-6 bg-cyan-500 text-white px-8 py-3 rounded-xl font-semibold shadow-lg transition-all duration-300 hover:bg-cyan-900 hover:scale-105 active:scale-95"
            type="button">Tenho código</button>
    </a>

        <a href="{{ url_for('consultas') }}">
        <button
            class="mt-6 bg-red-500 text-white px-8 py-3 rounded-xl font-semibold shadow-lg transition-all duration-300 hover:bg-red-700 hover:scale-105 active:scale-95"
            type="button">Relatar algum problema</button>
    </a>
</main>


{% endblock %}
