{% extends "base.html" %}

{% block content %}

<main class="flex flex-col items-center justify-center min-h-screen bg-cyan-100 p-6">

    <div id="tela_codigo"
        class="flex flex-col items-center bg-white p-8 rounded-2xl shadow-xl border border-cyan-200 transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl">

        <h2 class="text-xl font-bold mb-4">Registro de Problemas</h2>

        <form method="POST" class="w-full flex flex-col items-center gap-4">
            <input type="hidden" name="codigo" value="{{ codigo }}">
            <input type="text" name="codigo" placeholder="Digite o código"
                class="w-full bg-slate-100 border border-cyan-300 rounded-xl p-3 text-center text-lg font-mono tracking-[0.3em] text-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent">

            {% if pesquisa_realizada %}
            <div id="resultado" class="w-full border-2 border-dashed  rounded-xl p-5 text-center text-padrao font-mono font-bold tracking-[0.3em] 
                {% if registro %}
                bg-slate-100 border-green-400 text-cyan-700
                {% else %}
                bg-slate-100 border-red-400 text-red-700
                {% endif %}">

                {% if registro %}
                <p id="mensagem" class="mt-1 text-sm font-medium text-green-600" style="white-space: pre-line;">codigo:
                    <span class="text-cyan-700">{{ registro.codigo }}</span>
                </p>
                <hr class="my-5">

                <label for="problema" class="block mb-2 font-semibold">
                    Descreva o problema
                </label>

                <textarea id="descricao_problema" name="descricao_problema" rows="8" placeholder="Descreva o problema detalhadamente..."
                    class="w-full bg-slate-100 border border-cyan-300 rounded-xl p-3 text-lg text-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent resize-none"></textarea>

                <button
                    class=" mt-6 bg-cyan-600 text-white px-5 py-3 rounded-xl font-semibold shadow-lg transition-all duration-300 hover:bg-cyan-700 hover:scale-105 active:scale-95"
                    type="submit">Registrar</button>

                {% else %}
                <p id="mensagem" class="mt-3 text-sm font-medium text-red-600" style="white-space: pre-line;">{{mensagem }}
                </p>
                {% endif %}
            </div>
            {% endif %}

            <p>Digite o código para o registro de problemas.</p>

    </div>

    <button
        class="mt-6 bg-cyan-500 text-white px-8 py-3 rounded-xl font-semibold shadow-lg transition-all duration-300 hover:bg-cyan-900 hover:scale-105 active:scale-95"
        type="submit">Confirmar</button>

    </form>
    <a href="/">
        <button
            class="mt-6 bg-cyan-500 text-white px-8 py-3 rounded-xl font-semibold shadow-lg transition-all duration-300 hover:bg-cyan-900 hover:scale-105 active:scale-95"
            type="button">Voltar</button>
    </a>

</main>


{% endblock %}
