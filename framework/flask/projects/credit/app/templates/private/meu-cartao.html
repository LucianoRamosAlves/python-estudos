<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrediFácil - Meu Cartão</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/meu-cartao.css">
</head>
<body>

    <!-- BACKGROUND ANIMADO -->
    <div class="bg-animado" id="bgAnimado">
        <div class="bg-particulas" id="bgParticulas"></div>
        <div class="bg-ondas"></div>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-user">
            <div class="sidebar-avatar">LR</div>
            <div class="sidebar-user-info">
                <strong>Lucas Ramos</strong>
                <span>Cliente desde 2024</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item ativo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M2 10h20"/>
                    <path d="M7 15h.01"/>
                    <path d="M11 15h.01"/>
                </svg>
                <span>Meu Cartão</span>
            </a>
            <a href="dashboard.html" class="nav-item">
            <a href="suporte.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
                <span>Suporte</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="index.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Sair</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- Header -->
        <header class="content-header">
            <div class="header-left">
                <button class="sidebar-toggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div>
                    <h1>Meu Cartão</h1>
                    <p>Visualize as informações do seu cartão CrediFácil</p>
                </div>
            </div>
            <div class="header-right">
                <a href="#" class="btn-ajuda">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span>Ajuda</span>
                </a>
            </div>
        </header>

        <!-- Conteúdo -->
        <div class="content-body">

            <!-- Seletor de Cartão -->
            <div class="card-selector">
                <span class="selector-label">Seu cartão:</span>
                <div class="selector-opcoes">
                    <button class="selector-btn ativo" data-card="basico">
                        <span class="s-color s-basico"></span>
                        Básico
                    </button>
                    <button class="selector-btn" data-card="grafite">
                        <span class="s-color s-grafite"></span>
                        Grafite
                    </button>
                    <button class="selector-btn" data-card="metalico">
                        <span class="s-color s-metalico"></span>
                        Metálico
                    </button>
                </div>
            </div>

            <!-- Card Display -->
            <div class="card-display-wrapper">
                <div class="card-display" id="cardDisplay">
                    <!-- Gerado por JS -->
                </div>
            </div>

            <!-- Dados do Titular -->
            <div class="dados-titular">
                <div class="dados-card">
                    <div class="dados-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div>
                        <span class="dados-label">Titular</span>
                        <strong class="dados-valor" id="dadosTitular">Lucas Ramos</strong>
                    </div>
                </div>
                <div class="dados-card">
                    <div class="dados-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2"/>
                            <line x1="2" y1="10" x2="22" y2="10"/>
                        </svg>
                    </div>
                    <div>
                        <span class="dados-label">Nº do Cartão</span>
                        <strong class="dados-valor" id="dadosNumero">5489 1234 5678 9012</strong>
                    </div>
                </div>
                <div class="dados-card">
                    <div class="dados-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <div>
                        <span class="dados-label">Validade</span>
                        <strong class="dados-valor" id="dadosValidade">12/28</strong>
                    </div>
                </div>
                <div class="dados-card">
                    <div class="dados-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </div>
                    <div>
                        <span class="dados-label">CVV</span>
                        <strong class="dados-valor" id="dadosCvv">123</strong>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="../static/js/meu-cartao.js"></script>
</body>
</html>
