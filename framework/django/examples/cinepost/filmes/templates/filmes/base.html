{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% block title %}
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link
        href="{% static 'css/filmes.css' %}"
        rel="stylesheet"
    >
    <style>
        :root {
            --cinepost-bg: #101216;
            --cinepost-surface: #191c22;
            --cinepost-border: #2d323c;
            --cinepost-muted: #a7afbd;
            --cinepost-accent: #f0b35b;
        }

        body {
            background: var(--cinepost-bg);
            color: #f4f5f7;
        }

        .navbar-brand {
            letter-spacing: .04em;
        }

        .cinepost-main {
            min-height: calc(100vh - 144px);
        }

        .cinepost-surface {
            background: var(--cinepost-surface);
            border: 1px solid var(--cinepost-border);
        }

        .text-secondary,
        .form-text {
            color: var(--cinepost-muted) !important;
        }

        .text-accent {
            color: var(--cinepost-accent);
        }

        .form-control {
            background-color: #111318;
            border-color: var(--cinepost-border);
            color: #f4f5f7;
        }

        .form-control:focus {
            background-color: #111318;
            border-color: var(--cinepost-accent);
            color: #f4f5f7;
            box-shadow: 0 0 0 .2rem rgba(240, 179, 91, .2);
        }

        .form-control::placeholder {
            color: #7e8795;
        }

        .btn-accent {
            --bs-btn-color: #19130b;
            --bs-btn-bg: var(--cinepost-accent);
            --bs-btn-border-color: var(--cinepost-accent);
            --bs-btn-hover-color: #19130b;
            --bs-btn-hover-bg: #f6c77e;
            --bs-btn-hover-border-color: #f6c77e;
        }

        a {
            color: #f0b35b;
        }

        a:hover {
            color: #f6c77e;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary-subtle">
        <div class="container py-2">
            <a class="navbar-brand fw-bold" href="{% url 'filmes:post_list' %}">
                CinePost
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#cinepostNavbar"
                aria-controls="cinepostNavbar"
                aria-expanded="false"
                aria-label="Abrir navegação"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="cinepostNavbar">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'filmes:post_list' %}">Filmes</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="cinepost-main py-4 py-lg-5">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="border-top border-secondary-subtle py-4">
        <div class="container text-center text-secondary small">
            CinePost · Compartilhe sua opinião sobre filmes.
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>
</body>
</html>
