{% extends "filmes/base.html" %}

{% block title %}
    {{ post.titulo }}
{% endblock %}

{% block content %}

    <h1>{{ post.titulo }}</h1>

    <p class="date">
        Publicado em {{ post.publicado_em }}
        por {{ post.autor }}
    </p>

    <p>Nota: {{ post.nota }}</p>

    {{ post.comentario|linebreaks }}


    <p>
    <a href="{% url 'filmes:recomendar_post' post.id %}">
        Recomendar este post
    </a>
</p>

{% endblock %}
