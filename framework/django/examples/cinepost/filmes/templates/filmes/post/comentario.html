{% extends "filmes/base.html" %}

{% block title %}
    Adicionar comentário
{% endblock %}

{% block content %}

    {% if comentario %}

        <h2>Seu comentário foi adicionado.</h2>

        <p>
            <a href="{{ post.get_absolute_url }}">
                Voltar para o post
            </a>
        </p>

    {% else %}

        {% include "filmes/post/includes/comentario_form.html" %}

    {% endif %}

{% endblock %}
