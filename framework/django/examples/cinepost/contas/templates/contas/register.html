{% extends "filmes/base.html" %}

{% block title %}
Criar conta | CinePost
{% endblock %}

{% block content %}

<div class="py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-7 col-lg-5">

            <div class="card bg-black border-secondary shadow">

                <div class="card-body p-4 p-md-5">

                    <div class="mb-4">

                        <p class="text-uppercase text-danger small fw-semibold mb-1">
                            CinePost
                        </p>

                        <h1 class="h3 mb-2">
                            Criar conta
                        </h1>

                        <p class="text-secondary mb-0">
                            Preencha os dados abaixo para criar sua conta.
                        </p>

                    </div>

                    <form method="post">

                        {% csrf_token %}

                        {{ user_form.as_p }}

                        <div class="d-grid gap-2 mt-4">

                            <button type="submit" class="btn btn-danger">
                                Criar minha conta
                            </button>

                        </div>

                    </form>

                    <hr class="border-secondary my-4">

                    <p class="text-secondary text-center mb-0">

                        Já possui uma conta?

                        <a href="{% url 'login' %}" class="text-danger text-decoration-none">
                            Entrar
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
