{% extends "filmes/base.html" %}

{% block title %}
Sessão encerrada | CinePost
{% endblock %}

{% block content %}

<div class="py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-7 col-lg-5">

            <div class="card bg-black border-secondary shadow">

                <div class="card-body p-4 p-md-5 text-center">

                    <p class="text-uppercase text-danger small fw-semibold mb-2">
                        CinePost
                    </p>

                    <h1 class="h3 mb-3">
                        Você saiu da sua conta
                    </h1>

                    <p class="text-secondary mb-4">
                        Sua sessão foi encerrada com sucesso.
                    </p>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">

                        <a href="{% url 'login' %}" class="btn btn-danger">
                            Entrar novamente
                        </a>

                        <a href="{% url 'filmes:post_list' %}" class="btn btn-outline-secondary">
                            Ver filmes
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
