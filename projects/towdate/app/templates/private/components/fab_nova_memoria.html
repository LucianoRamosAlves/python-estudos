{% if show_memory_fab %}

<button
    class="td-memory-fab"
    type="button"
    data-memory-fab-trigger
    aria-label="Nova Memória"
>
    <span class="td-memory-fab__plus">+</span>
    <span class="td-memory-fab__text">Nova Memória</span>
</button>

<div class="td-memory-fab-modal" data-memory-fab-modal hidden>

    <div class="td-memory-fab-modal__backdrop" data-memory-fab-close></div>

    <div
        class="td-memory-fab-modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="memoryFabTitle"
    >

        <p class="td-memory-fab-modal__eyebrow">
            Próximo passo
        </p>

        <h3 id="memoryFabTitle">
            Nova Memória
        </h3>

        <p>
            A estrutura para criar uma nova memória ficará preparada aqui.
        </p>

        <div class="td-memory-fab-modal__actions">

            <button
                class="btn btn-outline"
                type="button"
                data-memory-fab-close
            >
                Fechar
            </button>

        </div>

    </div>

</div>

{% endif %}
